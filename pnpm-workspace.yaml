packages:
  - packages/*
minimumReleaseAge: 1440
# First-party releases are qualified here immediately after publication.
minimumReleaseAgeExclude:
  - '@nextwebwg/html-next'
  - '@threadlabs/looma'
  - '@threadlabs/markupkit'
  - 'markupress'
  - 'expressmark'
  - 'parseman'
linkWorkspacePackages: true
preferWorkspacePackages: true
allowBuilds:
  esbuild: true
